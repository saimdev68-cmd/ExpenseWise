<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f5f5f5; padding:30px;">
    <div style="max-width:600px; margin:auto; background:#fff; padding:30px; border-radius:8px;">
        <h2>Reset Your Password</h2>

        <p>Hi,</p>

        <p>We received a request to reset the password for your ExpenseWise account.</p>

        <p style="text-align:center; margin:30px 0;">
            <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
               style="background:#4f46e5; color:#fff; text-decoration:none; padding:12px 24px; border-radius:6px; display:inline-block;">
                Reset Password
            </a>
        </p>

        <p>If you didn't request a password reset, you can safely ignore this email.</p>

        <hr>

        <p>Regards,<br><strong>ExpenseWise Team</strong></p>
    </div>
</body>
</html>
